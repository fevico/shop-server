name: E-commerce Backend CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-ship:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    # Log into Docker Hub using your secure repository secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build and automatically tag the image with your Docker Hub repo address
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          fevico/ecommerce-backend:latest
          fevico/ecommerce-backend:${{ github.sha }}